services:
  agentgrid:
    build: .
    image: agentgrid-website:local
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_FRONTEND: "true"
      DATABASE_PATH: /app/data/agentgrid.sqlite
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - agentgrid_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agentgrid_data:
